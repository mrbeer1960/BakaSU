name: Build Fixed
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        run: |
          cd manager
          sed -i 's/extra\["managerVersionCode"\] = .*/extra["managerVersionCode"] = 35259/' build.gradle.kts
          sed -i 's/extra\["managerVersionName"\] = .*/extra["managerVersionName"] = "v4.2.0-rc3"/' build.gradle.kts
          sed -i 's/initialHeightOffset = -154f/initialHeightOffset = 0f/' app/src/main/java/org/bakasu/bakasu/ui/screen/main/HomePage.kt
          sed -i 's/if (state.showReboot) {/if (false) {/' app/src/main/java/org/bakasu/bakasu/ui/component/FlashOutputScreen.kt
          python3 - <<'PY'
          p='app/src/main/java/org/bakasu/bakasu/ui/screen/main/ModulePage.kt'
          s=open(p).read()
          i=s.find('onUninstallClicked(module)')
          seg=s[i:i+700]
          seg=seg.replace('disabledContainerColor','containerColor').replace('disabledContentColor','contentColor')
          s=s[:i]+seg+s[i+700:]
          lines=s.split('\n'); out=[]; k=0
          while k<len(lines):
              if 'showReplacingSnackbar(' in lines[k] and 'val result' in lines[k]:
                  d=lines[k].count('(')-lines[k].count(')'); k+=1
                  while k<len(lines) and d>0:
                      d+=lines[k].count('(')-lines[k].count(')'); k+=1
                  while k<len(lines) and lines[k].strip()=='': k+=1
                  if k<len(lines) and 'SnackbarResult.ActionPerformed' in lines[k]:
                      d=lines[k].count('{')-lines[k].count('}'); k+=1
                      while k<len(lines) and d>0:
                          d+=lines[k].count('{')-lines[k].count('}'); k+=1
                  continue
              out.append(lines[k]); k+=1
          lines=out; out=[]; k=0
          while k<len(lines):
              if 'val formatter = if (module.metamodule)' in lines[k]:
                  j=k
                  while j<len(lines) and 'ConfirmResult.Confirmed' not in lines[j]: j+=1
                  d=lines[j].count('{')-lines[j].count('}'); j+=1
                  while j<len(lines) and d>0:
                      d+=lines[j].count('{')-lines[j].count('}'); j+=1
                  k=j
                  continue
              out.append(lines[k]); k+=1
          open(p,'w').write('\n'.join(out))
          print('patched: no confirm dialog, no snackbar, uninstall button color')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build release
        run: |
          cd manager
          chmod +x gradlew
          ./gradlew assembleRelease -Pcommit=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Manager-release
          path: manager/app/build/outputs/apk/release/*.apk
