name: Build Fixed
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        run: |
          cd manager
          sed -i 's/extra\["managerVersionCode"\] = .*/extra["managerVersionCode"] = 35259/' build.gradle.kts
          sed -i 's/extra\["managerVersionName"\] = .*/extra["managerVersionName"] = "v4.2.0-rc3"/' build.gradle.kts
          sed -i 's/initialHeightOffset = -154f/initialHeightOffset = 0f/' app/src/main/java/org/bakasu/bakasu/ui/screen/main/HomePage.kt
          sed -i 's/if (state.showReboot) {/if (false) {/' app/src/main/java/org/bakasu/bakasu/ui/component/FlashOutputScreen.kt
          python3 - <<'PY'
          p='app/src/main/java/org/bakasu/bakasu/ui/screen/main/ModulePage.kt'
          s=open(p).read()
          s=s.replace('ButtonDefaults.filledTonalButtonColors().disabledContainerColor','ButtonDefaults.filledTonalButtonColors().containerColor')
          s=s.replace('ButtonDefaults.filledTonalButtonColors().disabledContentColor','ButtonDefaults.filledTonalButtonColors().contentColor')
          lines=s.split('\n'); out=[]; i=0
          while i<len(lines):
              if 'showReplacingSnackbar(' in lines[i] and 'val result' in lines[i]:
                  d=lines[i].count('(')-lines[i].count(')'); i+=1
                  while i<len(lines) and d>0:
                      d+=lines[i].count('(')-lines[i].count(')'); i+=1
                  while i<len(lines) and lines[i].strip()=='': i+=1
                  if i<len(lines) and 'SnackbarResult.ActionPerformed' in lines[i]:
                      d=lines[i].count('{')-lines[i].count('}'); i+=1
                      while i<len(lines) and d>0:
                          d+=lines[i].count('{')-lines[i].count('}'); i+=1
                  continue
              out.append(lines[i]); i+=1
          open(p,'w').write('\n'.join(out))
          print('snackbars removed')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build release
        run: |
          cd manager
          chmod +x gradlew
          ./gradlew assembleRelease -Pcommit=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Manager-release
          path: manager/app/build/outputs/apk/release/*.apk
